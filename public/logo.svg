<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-label="Fabjan Elezi Tech">
  <defs>
    <linearGradient id="fe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- FE monogram, italic slant like the original -->
  <g transform="translate(240 58) skewX(-14)" fill="url(#fe)" filter="url(#glow)">
    <!-- F -->
    <rect x="-64" y="-34" width="14" height="70" rx="2"/>
    <rect x="-64" y="-34" width="52" height="13" rx="2"/>
    <rect x="-64" y="-6"  width="40" height="12" rx="2"/>
    <!-- E -->
    <rect x="4"  y="-34" width="14" height="70" rx="2"/>
    <rect x="4"  y="-34" width="56" height="13" rx="2"/>
    <rect x="4"  y="-6"  width="44" height="12" rx="2"/>
    <rect x="4"  y="23"  width="56" height="13" rx="2"/>
    <!-- accent stroke above the E -->
    <rect x="38" y="-50" width="30" height="7" rx="3.5" fill="#a5f3fc"/>
  </g>
  <!-- Wordmark -->
  <text x="240" y="122" text-anchor="middle" font-family="Geist, 'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="24" letter-spacing="4.5" fill="#e2e8f0">FABJAN ELEZI</text>
  <g fill="#67e8f9">
    <rect x="150" y="141" width="52" height="1.5"/>
    <text x="240" y="147" text-anchor="middle" font-family="Geist, 'Space Grotesk', system-ui, sans-serif" font-weight="600" font-size="13" letter-spacing="6">TECH</text>
    <rect x="278" y="141" width="52" height="1.5"/>
  </g>
</svg>
